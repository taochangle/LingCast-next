services:
  worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        APT_MIRROR: ${APT_MIRROR-https://mirrors.tuna.tsinghua.edu.cn}
    depends_on:
      - srs
    ports:
      - "${WORKER_BIND_ADDRESS:-127.0.0.1}:${WORKER_HOST_PORT:-8090}:8090"
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN}
      TTS_URL: ${TTS_URL:?Set TTS_URL}
      TTS_TOKEN: ${TTS_TOKEN:?Set TTS_TOKEN}
      LIPSYNC_URL: ${LIPSYNC_URL:?Set LIPSYNC_URL}
      LIPSYNC_TOKEN: ${LIPSYNC_TOKEN:?Set LIPSYNC_TOKEN}
      WORKER_CACHE_DIR: /cache/worker
      SRS_RTMP_URL: "rtmp://srs:1935/live/{sessionId}"
      SRS_HTTP_URL: http://srs:8080
    volumes:
      - worker-cache:/cache/worker
    networks:
      - default
      - streaming

  srs:
    image: ${DOCKER_IMAGE_PREFIX-}ossrs/srs:5@sha256:5ed957dbebc48da42e928cebbc9446bced1c5afc58f816e122ce36d370af0113
    command: ["./objs/srs", "-c", "/etc/lingcast/srs.conf"]
    volumes:
      - ./deploy/srs.conf:/etc/lingcast/srs.conf:ro
    networks:
      - streaming

  tts:
    profiles: [models]
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/tts.Dockerfile
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PYTORCH_CU121_INDEX_URL: ${PYTORCH_CU121_INDEX_URL:-https://mirror.sjtu.edu.cn/pytorch-wheels/cu121}
        APT_MIRROR: ${APT_MIRROR-https://mirrors.tuna.tsinghua.edu.cn}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${TTS_GPU_ID:-0}"]
              capabilities: [gpu]
    ports:
      - "${TTS_BIND_ADDRESS:-127.0.0.1}:${TTS_HOST_PORT:-8091}:8091"
    environment:
      TTS_TOKEN: ${TTS_TOKEN:?Set TTS_TOKEN}
    volumes:
      - type: bind
        source: ${COSYVOICE_WEIGHTS_DIR:-./models/cosyvoice}
        target: /models/CosyVoice3
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TTS_DATA_DIR:-./data/tts}
        target: /data
        read_only: true
        bind:
          create_host_path: false

  lipsync:
    profiles: [models]
    platform: linux/amd64
    build:
      context: .
      dockerfile: deploy/lipsync.Dockerfile
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX-}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PYTORCH_CU118_INDEX_URL: ${PYTORCH_CU118_INDEX_URL:-https://mirror.sjtu.edu.cn/pytorch-wheels/cu118}
        MMCV_WHEEL_INDEX_URL: ${MMCV_WHEEL_INDEX_URL:-https://download.openmmlab.com/mmcv/dist/cu118/torch2.0.0/index.html}
        APT_MIRROR: ${APT_MIRROR-https://mirrors.tuna.tsinghua.edu.cn}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LIPSYNC_GPU_ID:-0}"]
              capabilities: [gpu]
    ports:
      - "${LIPSYNC_BIND_ADDRESS:-127.0.0.1}:${LIPSYNC_HOST_PORT:-8092}:8092"
    environment:
      LIPSYNC_TOKEN: ${LIPSYNC_TOKEN:?Set LIPSYNC_TOKEN}
      TTS_URL: ${TTS_URL:?Set TTS_URL}
      TTS_TOKEN: ${TTS_TOKEN:?Set TTS_TOKEN}
    volumes:
      - musetalk-cache:/cache/musetalk
      - type: bind
        source: ${MUSETALK_WEIGHTS_DIR:-./models/musetalk}
        target: /cache/musetalk/models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LIPSYNC_DATA_DIR:-./data/lipsync}
        target: /data
        bind:
          create_host_path: false

networks:
  streaming:
    internal: true

volumes:
  worker-cache:
  musetalk-cache:
