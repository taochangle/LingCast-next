services:
  app:
    build:
      context: .
      dockerfile: deploy/app.Dockerfile
      args:
        DOCKER_IMAGE_PREFIX: ${DOCKER_IMAGE_PREFIX-}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        GOPROXY: ${GOPROXY:-https://goproxy.cn}
        APK_MIRROR: ${APK_MIRROR-https://mirrors.tuna.tsinghua.edu.cn/alpine}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_HOST_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      MEDIA_TOKEN: ${MEDIA_TOKEN:?Set MEDIA_TOKEN}
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN}
      WORKER_URL: ${WORKER_URL:?Set WORKER_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      WORKER_MEDIA_BASE_URL: ${WORKER_MEDIA_BASE_URL:-}
      LLM_URL: ${LLM_URL:-}
      LLM_TOKEN: ${LLM_TOKEN:?Set LLM_TOKEN (use a generated unused token if LLM is disabled)}
      LLM_MODEL: ${LLM_MODEL:-}
      TIMEZONE: ${TIMEZONE:-Asia/Shanghai}
      WORKER_START_TIMEOUT: ${WORKER_START_TIMEOUT:-12m}
      DATA_DIR: /data
      STATIC_DIR: /opt/lingcast/ui
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  app-data:
