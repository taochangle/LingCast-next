services:
  fixture:
    image: ${SMOKE_PROJECT:?Set SMOKE_PROJECT}-worker
    command: ["python", "/fixture/fake_models.py"]
    environment:
      TTS_TOKEN: ${TTS_TOKEN:?Set TTS_TOKEN}
      LIPSYNC_TOKEN: ${LIPSYNC_TOKEN:?Set LIPSYNC_TOKEN}
    volumes:
      - ./tests/integration:/fixture:ro
    ports:
      - "127.0.0.1::8092"
